# Once a day: compare Gatefold's evaluators with X Layer mainnet on 80 TapeOut circuits (read-only eth_call), and,
# when LIVE_URL is set, check that the live site answers. Writes nothing to the repository. After RESULTS_DATE the job
# ends at once, so the badge never turns red after judging.
name: live
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"
permissions:
  contents: read
env:
  LIVE_URL: "https://marc-dvci.github.io/gatefold/"
  RESULTS_DATE: "2027-03-31"
jobs:
  xlayer:
    runs-on: ubuntu-latest
    steps:
      - name: Stop after the results date
        id: date
        run: |
          if [ "$(date -u +%F)" \> "$RESULTS_DATE" ]; then echo "past=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.date.outputs.past != 'yes'
        uses: actions/checkout@v4
      - if: steps.date.outputs.past != 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.date.outputs.past != 'yes'
        run: npm ci
      - name: Conformance against X Layer mainnet
        if: steps.date.outputs.past != 'yes'
        run: npx tsx scripts/conformance.ts | tail -n 1 | tee result.txt
      - name: The live site answers
        if: steps.date.outputs.past != 'yes' && env.LIVE_URL != ''
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$LIVE_URL" | grep -q '<title>Gatefold'
      - if: always() && steps.date.outputs.past != 'yes'
        run: |
          { echo "### Gatefold against X Layer mainnet"; echo; cat result.txt 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
