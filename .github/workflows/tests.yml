# On every push: lint, format, types, unit and property tests with coverage, the browser tests with axe-core, the
# Solidity tests with fuzzing, the cross-check against the official TAP-02 reference implementation, spelling and
# links, and the Docker image started and asked for its page. Read-only: nothing here writes to the repository.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npx tsc --noEmit
      - name: Unit and property tests in random order, with coverage of the core and the chain client
        run: npx vitest run --coverage --sequence.shuffle --reporter=default --reporter=json --outputFile=vitest.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (every page, axe-core accessibility, phone width)
        run: npx playwright test
      - name: Summary on the run page
        if: always()
        run: node scripts/ci_summary.mjs
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - name: Solidity tests, fuzzing included
        run: forge test -vv | tee forge.log
      - if: always()
        run: |
          {
            echo "### Gatefold Records (Foundry)"
            echo
            grep -E "Suite result|tests passed" forge.log | tail -n 2
          } >> "$GITHUB_STEP_SUMMARY"
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay every song with the official TAP-02 reference implementation
        run: python scripts/crosscheck_reference.py | tee crosscheck.log
      - if: always()
        run: |
          { echo "### TAP-02 reference implementation, replaying the songs"; echo; cat crosscheck.log; } >> "$GITHUB_STEP_SUMMARY"
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts
      - run: codespell
      - run: python scripts/check_links.py
      - run: python scripts/check_placeholders.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gatefold:demo .
      - run: docker run -d --name demo -p 127.0.0.1:8080:8080 gatefold:demo
      - name: The site answers, with its worklet and fonts
        run: |
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<title>Gatefold'
          curl -fs http://127.0.0.1:8080/fonts/inter-tight-latin-400-normal.woff2 -o /dev/null
          curl -fs http://127.0.0.1:8080/embed/gatefold.js -o /dev/null
      - if: failure()
        run: docker logs demo
