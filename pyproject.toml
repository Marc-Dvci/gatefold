# Settings for the Python helpers in scripts/ (the product itself is TypeScript and Solidity).

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.codespell]
skip = "./tests/fixtures/*,./examples/*,./third_party/*,./docs/evidence/*,*.png,*.jpg,*.gif,*.svg,*.mp3,*.woff2,*.lock,package-lock.json,.git,node_modules,dist,coverage,contracts/lib,contracts/out,third_party,examples,tests/fixtures,docs/evidence,scratch,*.hex"
ignore-words-list = "nd,te,inout,nin"
